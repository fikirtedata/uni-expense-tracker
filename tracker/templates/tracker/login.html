<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Uni Expense Tracker</title>
    <style>
        body { font-family: sans-serif; margin: 80px auto; max-width: 400px; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; }
        form p { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login to Your Tracker</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
